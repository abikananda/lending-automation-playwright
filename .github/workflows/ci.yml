name: Playwright Automation CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Build/lint may import runtime config, but CI never executes the live lending workflow.
      LENDER_USERNAME: ci-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      # Repository-wide formatting is not enforced in CI yet because the existing
      # develop baseline contains files that predate this workflow and do not pass
      # `npm run format:check`. Keep the script available locally and enable this
      # gate after a dedicated one-time formatting cleanup.

      # Intentionally do not run src/tests/lending.spec.ts in CI.
      # That workflow can perform real financial actions and must remain manually controlled.
